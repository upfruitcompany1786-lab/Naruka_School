<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d4d">
  <meta name="description" content="श्री नारुका माध्यमिक शिक्षण संस्थान, कायमसर - School ERP">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <title>श्री नारुका स्कूल ERP</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, "Noto Sans Devanagari", sans-serif; background: #eef2f8; color: #152044; }
    header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#101d4d; color:#fff; border-bottom:4px solid #d8a83e; }
    header img { width:54px; height:54px; object-fit:contain; background:#fff; border-radius:10px; }
    .school-name { font-weight:700; font-size:17px; line-height:1.35; }
    .sub { font-size:12px; color:#f4d78f; }
    .actions { margin-left:auto; display:flex; gap:8px; }
    button { border:1px solid #d8a83e; background:#fff; color:#101d4d; border-radius:8px; padding:9px 12px; font-weight:700; cursor:pointer; }
    main { height:calc(100vh - 82px); min-height:420px; padding:10px; }
    iframe { width:100%; height:100%; border:0; border-radius:10px; background:#fff; box-shadow:0 2px 12px #15204420; }
    @media(max-width:600px) { header { padding:8px; gap:8px; } header img { width:44px; height:44px; } .school-name { font-size:13px; } .sub { font-size:10px; } button { padding:8px; font-size:12px; } main { padding:5px; height:calc(100vh - 68px); } }
  </style>
</head>
<body>
  <header>
    <img src="./icons/icon-192.png" alt="School emblem">
    <div>
      <div class="school-name">श्री नारुका माध्यमिक शिक्षण संस्थान, कायमसर</div>
      <div class="sub">School Management System · सत्र 2026–27</div>
    </div>
    <div class="actions">
      <button id="reload" type="button">रीलोड</button>
      <button id="install" type="button" hidden>Install</button>
    </div>
  </header>
  <main>
    <iframe id="erp" src="https://script.google.com/macros/s/AKfycbzb9yT8skMmC_AeyzgA1OjBeCYj3t9xYUmDtD187eqJvm76MJyHZR2m68Ph11qHdZ98/exec" title="School ERP" allow="clipboard-read; clipboard-write"></iframe>
  </main>
  <script>
    const frame = document.getElementById('erp');
    document.getElementById('reload').addEventListener('click', () => frame.src = frame.src);
    let installPrompt;
    const installButton = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); installPrompt = event; installButton.hidden = false;
    });
    installButton.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null; installButton.hidden = true;
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
